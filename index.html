<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌Gửi bạn!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #ffd3a5 0%, #fd9853 25%, #ff9a9e 50%, #a1c4fd 75%, #c2e9fb 100%);
    background-size: 300% 300%;
    animation: gradientShift 12s ease infinite;
    font-family: 'Segoe UI', 'Georgia', serif;
    overflow-y:auto;
    overflow-x:hidden;
    perspective: 1200px;
    padding: 260px 0 60px;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .scene {
    position:relative;
    width:340px;
    height:240px;
    z-index:1;
  }

  /* ---------- Envelope ---------- */
  .envelope {
    position:absolute;
    width:100%;
    height:100%;
    cursor:pointer;
    transition: transform .6s ease;
  }

  .envelope.opened {
    pointer-events:none;
  }

  .env-body {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: linear-gradient(135deg,#f6e7c9,#f1d9a8);
    border-radius:6px;
    box-shadow: 0 20px 40px rgba(0,0,0,.45);
    overflow:hidden;
    z-index:3;
  }

  .env-body::before,
  .env-body::after {
    content:"";
    position:absolute;
    bottom:0;
    width:0; height:0;
    border-style:solid;
  }

  /* left triangle */
  .env-body::before {
    left:0;
    border-width:120px 0 120px 170px;
    border-color:transparent transparent transparent #e9cf9c;
    opacity:.8;
  }
  /* right triangle */
  .env-body::after {
    right:0;
    border-width:120px 170px 120px 0;
    border-color:transparent #e9cf9c transparent transparent;
    opacity:.8;
  }

  .env-flap {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:0;
    border-style:solid;
    border-width:120px 170px 0 170px;
    border-color:#eaceA0 transparent transparent transparent;
    transform-origin: top center;
    transition: transform .7s cubic-bezier(.6,.2,.3,1);
    z-index:6;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }

  .envelope.opened .env-flap {
    transform: rotateX(180deg);
    z-index:1;
  }

  .seal {
    position:absolute;
    top:92px; left:50%;
    transform:translateX(-50%);
    width:50px; height:50px;
    background: radial-gradient(circle at 35% 30%, #d1495b, #8a1f2d);
    border-radius:50%;
    box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 0 6px rgba(0,0,0,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f6e7c9;
    font-size:22px;
    z-index:7;
    transition: opacity .3s ease, transform .3s ease;
  }

  .envelope.opened .seal {
    opacity:0;
    transform:translateX(-50%) scale(0.5);
  }

  .hint {
    position:absolute;
    bottom:-40px;
    width:100%;
    text-align:center;
    color:#5c3a21;
    font-size:14px;
    font-weight:600;
    letter-spacing:.5px;
    opacity:.85;
    text-shadow: 0 1px 2px rgba(255,255,255,.5);
    animation: pulse 1.8s infinite ease-in-out;
  }

  @keyframes pulse {
    0%,100% { opacity:.5; }
    50% { opacity:1; }
  }

  /* ---------- Letter ---------- */
  .letter {
    position:absolute;
    left:50%;
    bottom:14px;
    width:280px;
    min-height:200px;
    max-height:200px;
    overflow:hidden;
    background:#fffdf6;
    border-radius:4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    padding:26px 22px;
    transform: translate(-50%, 20px) scale(0.9);
    transform-origin:bottom center;
    z-index:0;
    transition: transform .8s cubic-bezier(.2,.7,.3,1), max-height .8s ease, z-index 0s .4s;
    background-image: repeating-linear-gradient(#fffdf6 0px, #fffdf6 27px, #ecdfc0 28px);
  }

  .envelope.opened ~ .letter,
  .letter.pulled {
    transform: translate(-50%, -230px) scale(1);
    max-height:min(70vh, 520px);
    overflow-y:auto;
    z-index:10;
    transition: transform .8s cubic-bezier(.2,.7,.3,1), max-height .8s ease, z-index 0s;
    scroll-behavior: smooth; 
  }

  .letter-content {
    font-size:15px;
    line-height:28px;
    color:#3b2f2f;
    white-space:pre-wrap;
  }

  .letter-title {
    font-size:18px;
    font-weight:bold;
    margin-bottom:6px;
    color:#8a1f2d;
    opacity:0;
    transition: opacity .5s ease .3s;
  }

  .letter.pulled .letter-title {
    opacity:1;
  }

  .cursor {
    display:inline-block;
    width:2px;
    background:#3b2f2f;
    margin-left:2px;
    animation: blink 0.9s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity:0; }
  }

  .restart {
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    background:rgba(255,255,255,.55);
    color:#5c3a21;
    border:1px solid rgba(255,255,255,.8);
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    opacity:0;
    transition:opacity .5s ease;
    z-index:60;
  }

  .restart.show { opacity:1; }

  .backdrop {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0);
    z-index:50;
    pointer-events:none;
    transition: background .6s ease;
  }

  .backdrop.show {
    background:rgba(0,0,0,.55);
  }

  /* ---------- Riddle trigger button ---------- */
  .riddle-btn {
    display:inline-block;
    margin-top:18px;
    padding:11px 22px;
    background:linear-gradient(135deg,#ff9a76,#ff6f91);
    color:#fff;
    border:none;
    border-radius:20px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(255,111,145,.5);
    opacity:0;
    transform: translateY(6px);
    transition: opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }

  .riddle-btn.show {
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
    animation: riddlePulse 1.6s ease-in-out infinite;
  }

  @keyframes riddlePulse {
    0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 4px 14px rgba(255,111,145,.5); }
    50% { transform: translateY(0) scale(1.06); box-shadow: 0 6px 20px rgba(255,111,145,.7); }
  }

  .next-hint {
    margin-top:16px;
    font-size:12px;
    color:#a67c52;
    opacity:0;
    text-align:center;
    transition: opacity .4s ease;
  }

  .next-hint.show {
    opacity:1;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position:fixed;
    inset:0;
    background:rgba(30,20,20,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }

  .modal-overlay.show {
    display:flex;
  }

  .modal-box {
    background:#fffdf6;
    border-radius:14px;
    max-width:360px;
    width:100%;
    padding:26px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    text-align:center;
    position:relative;
  }

  .modal-close {
    position:absolute;
    top:10px;
    right:14px;
    background:none;
    border:none;
    font-size:20px;
    color:#999;
    cursor:pointer;
  }

  .modal-title {
    font-size:17px;
    font-weight:700;
    color:#8a1f2d;
    margin-bottom:10px;
  }

  .modal-riddle {
    font-size:14px;
    color:#4a3b3b;
    line-height:22px;
    margin-bottom:16px;
  }

  .modal-input {
    width:100%;
    padding:10px 12px;
    border:1.5px solid #e5cdb8;
    border-radius:8px;
    font-size:14px;
    margin-bottom:10px;
    outline:none;
    text-align:center;
    letter-spacing:1px;
  }

  .modal-input:focus {
    border-color:#ff6f91;
  }

  .modal-submit {
    width:100%;
    padding:10px;
    background:linear-gradient(135deg,#ff9a76,#ff6f91);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition: opacity .2s ease;
  }

  .modal-submit:disabled {
    opacity:.6;
    cursor:not-allowed;
  }

  .modal-feedback {
    margin-top:10px;
    font-size:13px;
    min-height:18px;
  }

  .modal-feedback.error { color:#c0392b; }
  .modal-feedback.success { color:#2e8b57; }
  .modal-feedback.playful { color:#e67e22; font-weight: 500;}

  .modal-answer {
    margin-top:14px;
    padding:14px;
    background:#fef3e2;
    border-radius:8px;
    font-size:14px;
    color:#5c3a21;
    line-height:22px;
    display:none;
  }

  .modal-answer.show { display:block; }
  
  /* Căn giữa hình ảnh trong phần đáp án */
  .kitkat-img {
    width: 100%;
    max-width: 220px;
    border-radius: 8px;
    margin: 12px auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    display: block;
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<div class="scene">
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="seal">💌</div>
  </div>

  <div class="letter" id="letter">
    <div class="letter-title">Gửi bạn ấy,</div>
    <div class="letter-content" id="letterText"></div>
    <div class="next-hint" id="nextHint">👇 Nhấn vào nút bên dưới nhé</div>
    <button class="riddle-btn" id="riddleBtn">🎁 Có quà nhỏ dành cho bạn...</button>
  </div>

  <div class="hint" id="hint">Nhấn vào phong bì để mở thư</div>
</div>

<button class="restart" id="restartBtn">Mở lại thư</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title">Nhận quà nhỏ từ mình 🎁</div>
    
    <div class="modal-riddle">
      <strong>Đố vui:</strong> Con mèo hôn nhau thì gọi là gì? 🤔<br><br>
      <i>(Gợi ý: Nhập số điện thoại của bạn vào đây để xem đáp án và nhận quà nhé!)</i>
    </div>

    <input type="tel" class="modal-input" id="phoneInput" placeholder="Nhập số điện thoại..." maxlength="11">
    <button class="modal-submit" id="modalSubmit">Gửi</button>
    <div class="modal-feedback" id="modalFeedback"></div>
    <div class="modal-answer" id="modalAnswer"></div>
  </div>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const letterText = document.getElementById('letterText');
  const hint = document.getElementById('hint');
  const restartBtn = document.getElementById('restartBtn');
  const backdrop = document.getElementById('backdrop');

  const message = `Chào bạn,

Mình biết thế này có hơi bất ngờ, nhưng mình muốn gửi một lời chào thật lòng đến bạn.
Từ lần đầu thấy bạn, mình đã có ấn tượng khá đặc biệt với bạn.

Mình không dám chắc mình sẽ để lại ấn tượng gì trong mắt bạn,
nhưng mình nghĩ nếu không thử làm quen thì chắc sẽ tiếc lắm.

Nếu bạn cũng thấy thoải mái, mình rất mong được trò chuyện nhiều hơn,
biết thêm về sở thích, những điều bạn thích và cả những câu chuyện vui của bạn.

Không cần phải vội, mình chỉ mong mình có thể trở thành
một người bạn mà bạn thấy dễ chịu khi trò chuyện cùng.

Rất mong nhận được hồi âm từ bạn.

Thân mến,
[Nghị]`;

  let typingTimer = null;

  function typeWriter(text, el, speed = 40, onDone) {
    let i = 0;
    el.innerHTML = '<span class="cursor">&nbsp;</span>';
    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
      if (i < text.length) {
        const shown = text.slice(0, i + 1);
        el.innerHTML = shown.replace(/\n/g, '<br>') + '<span class="cursor">&nbsp;</span>';
        i++;
        letter.scrollTop = letter.scrollHeight;
      } else {
        clearInterval(typingTimer);
        el.innerHTML = text.replace(/\n/g, '<br>');
        if (onDone) onDone();
      }
    }, speed);
  }

  function openEnvelope() {
    envelope.classList.add('opened');
    hint.style.opacity = '0';

    setTimeout(() => {
      letter.classList.add('pulled');
    }, 350);

    setTimeout(() => {
      typeWriter(message, letterText, 30, () => {
        riddleBtn.classList.add('show');
        nextHint.classList.add('show');
        setTimeout(() => {
          letter.scrollTop = letter.scrollHeight;
        }, 100);
      });
      restartBtn.classList.add('show');
    }, 1300);
  }

  function resetScene() {
    clearInterval(typingTimer);
    envelope.classList.remove('opened');
    letter.classList.remove('pulled');
    letterText.innerHTML = '';
    restartBtn.classList.remove('show');
    riddleBtn.classList.remove('show');
    nextHint.classList.remove('show');
    setTimeout(() => {
      hint.style.opacity = '.8';
    }, 700);
  }

  envelope.addEventListener('click', () => {
    if (!envelope.classList.contains('opened')) {
      openEnvelope();
    }
  });

  restartBtn.addEventListener('click', resetScene);

  /* ---------- Gift modal logic ---------- */
  // CHÚ Ý: Đảm bảo link này là link thật sinh ra từ Google Apps Script của bạn
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSr82AX2V_sQaDSbVjEcKNY3loh09UM3anzKqS280NXycSTE7duJ1w8DbIFawljI1X/exec";
  
  const MY_CONTACT_NAME = "Nghị";
  const MY_CONTACT_PHONE = "0965667282";
  const MY_CONTACT_ZALO = "0965667282"; 

  const MAX_ATTEMPTS = 3;
  const STORAGE_KEY = "gift_attempts";
  const DONE_KEY = "gift_done";

  const riddleBtn = document.getElementById('riddleBtn');
  const nextHint = document.getElementById('nextHint');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const phoneInput = document.getElementById('phoneInput');
  const modalSubmit = document.getElementById('modalSubmit');
  const modalFeedback = document.getElementById('modalFeedback');
  const modalAnswer = document.getElementById('modalAnswer');

  function getAttempts() {
    return parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
  }

  function setAttempts(n) {
    localStorage.setItem(STORAGE_KEY, n);
  }

  function isDone() {
    return localStorage.getItem(DONE_KEY) === "1";
  }

  function markDone() {
    localStorage.setItem(DONE_KEY, "1");
  }

  // CẬP NHẬT GIAO DIỆN PHẦN ĐÁP ÁN: THÊM HÌNH KITKAT
  function contactHtml() {
    let html = `Đáp án là: <strong>Kitkat</strong> 🍫<br>
    <img src="kitkat.png" alt="Thanh kẹo Kitkat" class="kitkat-img">
    Cảm ơn bạn đã kiên nhẫn làm theo mình nha! 💛<br><br>Rất mong nhận được hồi âm từ bạn! 🥹<br><br>
    <strong>${MY_CONTACT_NAME}</strong><br>
    `;
    if (MY_CONTACT_ZALO) {
      html += `<br>💬 Zalo: ${MY_CONTACT_ZALO}`;
    }
    return html;
  }

  function showContactScreen() {
    modalFeedback.textContent = '';
    modalAnswer.innerHTML = contactHtml();
    modalAnswer.classList.add('show');
    phoneInput.style.display = 'none';
    modalSubmit.style.display = 'none';
    markDone();
  }

  function logAttempt(phone, attempt) {
    if (!APPS_SCRIPT_URL) return;
    
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', 
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify({ phone: phone, attempt: attempt })
    }).catch((error) => console.log('Lỗi khi gửi log:', error));
  }

  riddleBtn.addEventListener('click', () => {
    modalOverlay.classList.add('show');
    modalFeedback.textContent = '';
    modalAnswer.classList.remove('show');
    phoneInput.style.display = '';
    modalSubmit.style.display = '';
    phoneInput.disabled = false;
    modalSubmit.disabled = false;

    if (isDone()) {
      showContactScreen();
    } else {
      phoneInput.focus();
    }
  });

  function closeModal() {
    modalOverlay.classList.remove('show');
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  function submitPhone() {
    const rawPhone = phoneInput.value.trim();
    
    if (!rawPhone) {
      modalFeedback.className = 'modal-feedback error';
      modalFeedback.textContent = 'Bạn chưa nhập số điện thoại kìa!';
      return;
    }

    const cleanPhone = rawPhone.replace(/[\s\-\.]/g, "");
    const phoneRegex = /^0[35789]\d{8}$/;
    
    if (!phoneRegex.test(cleanPhone)) {
      modalFeedback.className = 'modal-feedback error';
      modalFeedback.textContent = 'Số điện thoại không hợp lệ. Vui lòng nhập số có 10 chữ số bắt đầu bằng 0 nhé!';
      return;
    }

    const attempts = getAttempts() + 1;
    setAttempts(attempts);
    logAttempt(cleanPhone, attempts);

    if (attempts === 1) {
      modalFeedback.className = 'modal-feedback playful';
      modalFeedback.textContent = 'Haha, hệ thống "đơ" xíu vì bạn dễ thương quá. Nhập lại lần nữa xem sao! 🤭';
      phoneInput.value = ''; 
    } 
    else if (attempts === 2) {
      modalFeedback.className = 'modal-feedback playful';
      modalFeedback.textContent = 'Sắp được rồi! Hứa là lần cuối nè, gõ lại một lần nữa bằng tất cả sự chân thành nào! ✨';
      phoneInput.value = ''; 
    } 
    else {
      showContactScreen();
    }
  }

  modalSubmit.addEventListener('click', submitPhone);
  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPhone();
  });
</script>

</body>
</html>
